<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cujis | Our Wedding</title>
    
    <!-- Import Elegant Calligraphy Font (Alex Brush) -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           GLOBAL CALLIGRAPHY STYLES
           ========================================= */
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Alex Brush', cursive !important;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
            text-align: center;
            font-size: 1.8rem; /* Increased size for readable handwriting */
        }
        
        /* Apply Calligraphy to all interactive elements */
        input, button, select, textarea, a, label {
            font-family: 'Alex Brush', cursive !important;
            text-transform: none !important; /* Keeps letters connected */
            letter-spacing: 0 !important; /* Prevents gaps in cursive script */
        }

        /* Forces all images into crystal clear Black & White */
        img {
            filter: grayscale(100%);
            max-width: 100%;
            height: auto;
        }
        
        h1, h2, h3 {
            font-weight: normal;
            text-transform: none !important;
            letter-spacing: 0 !important;
            margin-bottom: 1rem;
            font-size: 3.5rem; /* Larger sizes for calligraphic titles */
        }
        
        /* =========================================
           THE MONET CURTAIN REVEAL
           ========================================= */
        .curtain-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('images/monet.jpg');
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.86, 0, 0.07, 1), opacity 1.2s ease;
            cursor: pointer;
            filter: grayscale(100%); 
        }
        .curtain-overlay::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }
        .curtain-content {
            text-align: center;
            z-index: 1;
            width: 90%; 
        }
        .cursive-names {
            font-size: 8vw; 
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            line-height: 1.1;
        }
        .enter-text {
            font-size: 2.5vw; 
            color: #ffffff;
            animation: pulse 2.5s infinite;
            margin: 0;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        .curtain-open {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        /* =========================================
           STICKY HEADER & NAVIGATION
           ========================================= */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0;
            z-index: 1000;
        }
        header h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }
        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.8rem;
            transition: opacity 0.3s ease;
        }
        nav a:hover {
            opacity: 0.5;
        }

        /* =========================================
           PAGE SECTIONS (One Page Layout)
           ========================================= */
        section {
            padding: 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            border-bottom: 1px solid #eeeeee;
        }
        section:last-of-type {
            border-bottom: none;
        }
        .sleek-photo {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 2rem auto;
            display: block;
        }
        .date-highlight {
            font-size: 2.2rem;
            margin-top: 1rem;
        }

        /* =========================================
           FORMS & BUTTONS (RSVP)
           ========================================= */
        .sleek-form {
            max-width: 500px;
            margin: 2rem auto;
            text-align: left;
        }
        .sleek-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            color: #000000;
        }
        .sleek-form input[type="text"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #000000;
            background-color: transparent;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            outline: none;
        }
        
        /* Radio Buttons */
        .radio-group {
            margin-bottom: 2rem;
        }
        .radio-label {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        .radio-label input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            accent-color: #000000; /* Uses black to match the theme */
        }
        
        /* Elegant Calligraphy Button */
        .sleek-btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 2rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }
