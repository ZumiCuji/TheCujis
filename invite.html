<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You Are Invited! — Zumi & Morgan</title>

    <meta name="description" content="You are invited to the wedding of Zumi Cuji and Morgan Fields — Monday, May 3, 2027, Raleigh, NC.">
    <meta name="theme-color" content="#71843f">
    <meta name="color-scheme" content="light">
    <link rel="canonical" href="https://zumicuji.github.io/TheCujis/invite.html">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238a6a28'/%3E%3Ctext x='32' y='40' font-family='Georgia,serif' font-size='24' font-weight='600' text-anchor='middle' fill='%23fffdf4'%3EZM%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:title" content="You Are Invited! — Zumi & Morgan">
    <meta property="og:description" content="Monday, May 3, 2027 · Raleigh, NC">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zumicuji.github.io/TheCujis/invite.html">
    <meta property="og:image" content="https://zumicuji.github.io/TheCujis/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Zumi and Morgan's wedding invitation">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="You Are Invited! — Zumi & Morgan">
    <meta name="twitter:description" content="Monday, May 3, 2027 · Raleigh, NC">
    <meta name="twitter:image" content="https://zumicuji.github.io/TheCujis/og-image.jpg">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Wedding of Zumi Cuji & Morgan Fields",
        "startDate": "2027-05-03",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
            "@type": "Place",
            "name": "The Merrimon-Wynne House",
            "address": {
                "@type": "PostalAddress",
                "addressLocality": "Raleigh",
                "addressRegion": "NC",
                "addressCountry": "US"
            }
        },
        "url": "https://zumicuji.github.io/TheCujis/invite.html"
    }
    </script>

    <script>
        document.documentElement.classList.add("js");

        window.__inviteBoot = setTimeout(function () {
            document.documentElement.classList.add("js-failed");
        }, 10000);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;500;600&display=swap"
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;500;600&display=swap"
        media="print"
        onload="this.media='all'"
    >

    <noscript>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;500;600&display=swap"
        >
    </noscript>

    <link rel="preload" as="image" href="invite1.png" fetchpriority="high">

    <style>
        html,
        body {
            margin: 0;
            background: #f1f4e7;
        }

        .js .envelope {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #71843f;
        }
    </style>

    <link rel="stylesheet" href="invite.css?v=7">
    <script src="invite.js?v=7" defer></script>
</head>

<body>
    <a class="skip-link" href="#suite">Skip to the invitation</a>

    <div id="app" data-state="closed">

        <section class="envelope" id="envelope" aria-label="Wedding invitation envelope">
            <div class="envelope__scene" id="envelopeScene">

                <!-- Closed envelope front: personalized guest name only -->
                <div class="envelope__front-face">
                    <p class="envelope__front-recipient" id="frontGuestLine" hidden></p>
                </div>

                <!-- Reverse side of envelope: used for opening animation -->
                <div class="envelope__inside-face">
                    <div class="envelope__back"></div>
                    <div class="envelope__liner"></div>

                    <div class="envelope__card" aria-hidden="true">
                        <div class="envelope__card-inner">
                            <img
                                class="card-img"
                                src="invite1.png"
                                alt=""
                                decoding="async"
                                draggable="false"
                            >
                        </div>
                    </div>

                    <div class="fold fold--left" aria-hidden="true">
                        <div class="fold__hinge">
                            <div class="fold__face fold__face--out">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <defs>
                                        <linearGradient id="gFoldL" x1="0" y1="0" x2="1" y2="0">
                                            <stop offset="0" stop-color="#b3c573"></stop>
                                            <stop offset="1" stop-color="#a6b965"></stop>
                                        </linearGradient>
                                    </defs>
                                    <polygon points="0,0 100,50 0,100" fill="url(#gFoldL)"></polygon>
                                    <polyline points="0,0 100,50 0,100" class="crease-shadow"></polyline>
                                    <polyline points="0,0 100,50 0,100" class="crease-light"></polyline>
                                </svg>
                            </div>

                            <div class="fold__face fold__face--in">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <polygon points="0,0 100,50 0,100" fill="#e9e3c8"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="fold fold--right" aria-hidden="true">
                        <div class="fold__hinge">
                            <div class="fold__face fold__face--out">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <defs>
                                        <linearGradient id="gFoldR" x1="1" y1="0" x2="0" y2="0">
                                            <stop offset="0" stop-color="#b3c573"></stop>
                                            <stop offset="1" stop-color="#a6b965"></stop>
                                        </linearGradient>
                                    </defs>
                                    <polygon points="100,0 0,50 100,100" fill="url(#gFoldR)"></polygon>
                                    <polyline points="100,0 0,50 100,100" class="crease-shadow"></polyline>
                                    <polyline points="100,0 0,50 100,100" class="crease-light"></polyline>
                                </svg>
                            </div>

                            <div class="fold__face fold__face--in">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <polygon points="100,0 0,50 100,100" fill="#e9e3c8"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="fold fold--bottom" aria-hidden="true">
                        <div class="fold__hinge">
                            <div class="fold__face fold__face--out">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <defs>
                                        <linearGradient id="gFoldB" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0" stop-color="#a6b965"></stop>
                                            <stop offset="1" stop-color="#9bae5b"></stop>
                                        </linearGradient>
                                    </defs>
                                    <polygon points="0,100 50,0 100,100" fill="url(#gFoldB)"></polygon>
                                    <polyline points="0,100 50,0 100,100" class="crease-shadow"></polyline>
                                    <polyline points="0,100 50,0 100,100" class="crease-light"></polyline>
                                </svg>
                            </div>

                            <div class="fold__face fold__face--in">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <polygon points="0,100 50,0 100,100" fill="#e9e3c8"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="envelope__flap-wrap" aria-hidden="true">
                        <div class="envelope__flap" id="envFlap">
                            <div class="envelope__flap-face envelope__flap-face--out">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <defs>
                                        <linearGradient id="gFlapOut" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0" stop-color="#cbd98f"></stop>
                                            <stop offset="1" stop-color="#b3c573"></stop>
                                        </linearGradient>
                                    </defs>
                                    <polygon points="0,0 100,0 50,100" fill="url(#gFlapOut)"></polygon>
                                    <polyline points="0,0 50,100 100,0" class="crease-shadow"></polyline>
                                    <polyline points="0,0 50,100 100,0" class="crease-light"></polyline>
                                </svg>
                            </div>

                            <div class="envelope__flap-face envelope__flap-face--in">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                    <polygon points="0,0 100,0 50,100" fill="#ece6cc"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <p class="envelope__note" id="envNote" aria-live="polite">
                        Opening invitation…
                    </p>
                </div>
            </div>

            <!-- Invisible but keyboard-accessible full envelope opening target -->
            <button
                class="envelope__open-target"
                id="openInvite"
                type="button"
                aria-label="Open Zumi and Morgan's wedding invitation"
            ></button>
        </section>

        <main class="suite" id="suite">
            <h1 class="sr-only" id="suiteHeading" tabindex="-1">
                You are invited — Zumi and Morgan's wedding, Monday, May 3, 2027, Raleigh, North Carolina
            </h1>

            <section
                class="carousel"
                aria-roledescription="carousel"
                aria-label="Wedding invitation cards"
            >
                <div
                    class="track"
                    id="track"
                    tabindex="0"
                    aria-label="Invitation cards. Swipe, tap a card, or use the left and right arrow keys."
                >
                    <figure
                        class="slide"
                        role="group"
                        aria-roledescription="slide"
                        aria-label="1 of 2: Formal invitation"
                    >
                        <img
                            class="card-img"
                            src="invite1.png"
                            alt="Formal wedding invitation for Zumi Cuji and Morgan Fields"
                            decoding="async"
                            fetchpriority="high"
                            draggable="false"
                        >
                    </figure>

                    <figure
                        class="slide"
                        role="group"
                        aria-roledescription="slide"
                        aria-label="2 of 2: Wedding details"
                    >
                        <img
                            class="card-img"
                            src="invite2.png"
                            alt="Wedding details card"
                            decoding="async"
                            loading="eager"
                            draggable="false"
                        >
                    </figure>
                </div>
            </section>

            <div class="dock">
                <div class="indicator" aria-hidden="true" data-needs-js>
                    <span class="is-current"></span>
                    <span></span>
                </div>

                <a
                    class="btn"
                    href="https://zumicuji.github.io/TheCujis/index.html#rsvp"
                >
                    Visit Our Wedding Website to RSVP!
                </a>
            </div>
        </main>

        <div class="sr-only" id="live" aria-live="polite"></div>
    </div>
</body>
</html>
