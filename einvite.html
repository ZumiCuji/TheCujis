<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Invited! — Zumi & Morgan</title>

    <meta property="og:title" content="You are Invited! — Zumi & Morgan">
    <meta property="og:description" content="Monday, May 3, 2027 · Raleigh, NC">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zumicuji.github.io/TheCujis/invite.html">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="You are Invited! — Zumi & Morgan">
    <meta name="twitter:description" content="Monday, May 3, 2027 · Raleigh, NC">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --pear-light: #dce7ad;
            --pear: #b9ca77;
            --pear-mid: #a6b965;
            --pear-deep: #71843f;
            --pear-dark: #53652d;
            --cream: #fffdf4;
            --cream-deep: #f3ecd8;
            --gold: #b99754;
            --ink: #36502f;
            --page: #f1f4e7;

            --envelope-width: min(92vw, 374px);
            --envelope-height: 278px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 12%, rgba(220, 231, 173, 0.78), transparent 31%),
                radial-gradient(circle at 89% 88%, rgba(185, 151, 84, 0.13), transparent 28%),
                var(--page);
            font-family: "Montserrat", sans-serif;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(24px, 5svh, 64px) 14px;
        }

        .experience {
            width: min(100%, 700px);
            margin: 0 auto;
            text-align: center;
        }

        /* =====================================================
           CENTERED INVITATION SUITE STAGE
           ===================================================== */
        .suite-stage {
            position: relative;
            width: 100%;
            min-height: max(590px, 78svh);
            overflow: visible;
        }

        .envelope-stage {
            display: none;
        }

        /*
            The primary card sits in this pocket while extracting.
            The pocket masks anything below the envelope's bottom edge,
            but allows the card to rise visibly above the top opening.
        */
        .extraction-pocket {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 5;
            width: var(--envelope-width);
            height: var(--envelope-height);
            pointer-events: none;
            clip-path: inset(-600px 0 0 0);
            transform: translate(-50%, -50%);
            transition: clip-path 0s linear;
        }

        .suite-card {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            padding: 0;
            margin: 0;
            background: transparent;
            border: 0;
            cursor: pointer;
            image-rendering: auto;
            transition:
                width 0.48s cubic-bezier(0.2, 0.78, 0.25, 1),
                transform 0.48s cubic-bezier(0.2, 0.78, 0.25, 1),
                top 0.7s cubic-bezier(0.16, 0.9, 0.25, 1),
                opacity 0.3s ease;
        }

        .suite-card:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 6px;
        }

        .suite-card img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            background: var(--cream);
            box-shadow: 0 14px 28px rgba(54, 72, 25, 0.2);
            image-rendering: auto;
        }

        /* Resting stationery stack. */
        .card-primary {
            z-index: 4;
            width: min(67vw, 315px);
            transform: translate(-50%, -50%) rotate(-1deg);
        }

        .card-details {
            z-index: 2;
            width: min(54vw, 250px);
            transform: translate(calc(-50% - 48px), calc(-50% - 30px)) rotate(-4deg);
        }

        .card-photo {
            z-index: 1;
            width: min(43vw, 190px);
            transform: translate(calc(-50% + 68px), calc(-50% + 13px)) rotate(4deg);
        }

        /*
            JavaScript sets --selected-width based on each PNG's
            natural aspect ratio plus available screen space.
        */
        .card-primary.is-selected,
        .card-details.is-selected {
            z-index: 15;
            width: var(--selected-width, min(96vw, 440px));
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
        }

        .card-photo.is-selected {
            z-index: 15;
            width: var(--selected-width, min(64vw, 280px));
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
        }

        .suite-card.is-selected img {
            width: 100%;
            height: auto;
            max-height: calc(100svh - 92px);
            object-fit: contain;
            box-shadow: 0 25px 45px rgba(54, 72, 25, 0.3);
        }

        /* =====================================================
           SIDE ARROWS
           ===================================================== */
        .card-navigation {
            position: absolute;
            top: 50%;
            right: 0;
            left: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
            pointer-events: none;
            transform: translateY(-50%);
            transition: opacity 0.35s ease;
        }

        .nav-arrow {
            display: grid;
            width: 42px;
            height: 56px;
            place-items: center;
            color: var(--ink);
            background: rgba(255, 253, 244, 0.18);
            border: 1px solid rgba(83, 101, 45, 0.2);
            border-radius: 24px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 1.65rem;
            font-weight: 300;
            line-height: 1;
            opacity: 0.34;
            pointer-events: auto;
            transition:
                opacity 0.2s ease,
                color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .nav-arrow:hover,
        .nav-arrow:focus-visible {
            color: var(--cream);
            background: var(--ink);
            opacity: 0.92;
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .nav-arrow:active {
            transform: scale(0.94);
        }

        /* =====================================================
           POST-OPEN WEBSITE BUTTON
           ===================================================== */
        .suite-actions {
            margin: -16px auto 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .website-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 13px 19px;
            color: var(--ink);
            background: rgba(185, 202, 119, 0.72);
            border: 1px solid rgba(83, 101, 45, 0.58);
            box-shadow: 0 4px 12px rgba(83, 101, 45, 0.1);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            line-height: 1.3;
            text-decoration: none;
            text-transform: uppercase;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .website-button:hover,
        .website-button:focus-visible {
            color: var(--cream);
            background: rgba(83, 101, 45, 0.88);
            border-color: rgba(83, 101, 45, 0.95);
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .website-button:active {
            transform: scale(0.98);
        }

        .replay-button {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 50;
            padding: 9px 11px;
            color: var(--ink);
            background: rgba(255, 253, 244, 0.96);
            border: 1px solid var(--gold);
            cursor: pointer;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 1.1px;
            opacity: 0;
            pointer-events: none;
            text-transform: uppercase;
            transition: opacity 0.3s ease, background 0.2s ease;
        }

        .replay-button:hover,
        .replay-button:focus-visible {
            background: #ffffff;
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        /* =====================================================
           REALISTIC PEAR-GREEN ENVELOPE
           ===================================================== */
        .js .envelope-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: var(--envelope-width);
            height: var(--envelope-height);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .js .envelope-trigger {
            position: absolute;
            inset: 0;
            z-index: 20;
            padding: 0;
            background: transparent;
            border: 0;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .js .envelope-trigger:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 9px;
            border-radius: 8px;
        }

        /* Back envelope layer. */
        .envelope-back {
            position: absolute;
            top: 25px;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            background: var(--pear-deep);
            border-radius: 5px 5px 12px 12px;
            box-shadow: 0 20px 22px rgba(54, 72, 25, 0.22);
        }

        /* Cream liner layer. */
        .envelope-liner {
            position: absolute;
            top: 26px;
            left: 50%;
            z-index: 2;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-width: 0 187px 132px;
            border-style: solid;
            border-color: transparent transparent var(--cream-deep);
        }

        .envelope-liner::after {
            position: absolute;
            top: 35px;
            left: -94px;
            width: 188px;
            height: 75px;
            content: "";
            opacity: 0.48;
            background:
                radial-gradient(ellipse at 15% 45%, transparent 0 12px, rgba(83, 101, 45, 0.28) 13px 14px, transparent 15px),
                radial-gradient(ellipse at 46% 72%, transparent 0 13px, rgba(83, 101, 45, 0.28) 14px 15px, transparent 16px),
                radial-gradient(ellipse at 78% 38%, transparent 0 11px, rgba(83, 101, 45, 0.28) 12px 13px, transparent 14px);
        }

        .primary-card-peek {
            position: absolute;
            top: 43px;
            left: 50%;
            z-index: 3;
            width: 77%;
            height: 162px;
            overflow: hidden;
            background: var(--cream);
            border: 1px solid var(--gold);
            box-shadow: 0 5px 9px rgba(54, 72, 25, 0.15);
            transform: translateX(-50%);
        }

        .primary-card-peek img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Front folds conceal the lower portion of the emerging card. */
        .envelope-front {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 8;
            height: 190px;
            overflow: hidden;
            background: var(--pear-mid);
            border-radius: 0 0 12px 12px;
        }

        .envelope-front::before,
        .envelope-front::after {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            content: "";
            border-style: solid;
        }

        .envelope-front::before {
            left: 0;
            z-index: 1;
            border-width: 95px 187px 95px 0;
            border-color: transparent var(--pear-light) transparent transparent;
        }

        .envelope-front::after {
            right: 0;
            z-index: 1;
            border-width: 95px 0 95px 187px;
            border-color: transparent transparent transparent #96aa57;
        }

        .envelope-bottom-fold {
            position: absolute;
            bottom: 0;
            left: 50%;
            z-index: 9;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-width: 0 187px 104px;
            border-style: solid;
            border-color: transparent transparent #aabb66;
        }

        .envelope-flap {
            position: absolute;
            top: 25px;
            left: 0;
            z-index: 10;
            width: 100%;
            height: 138px;
            transform: rotateX(0deg);
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.22, 0.8, 0.25, 1);
        }

        .envelope-flap::before {
            position: absolute;
            inset: 0;
            content: "";
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background:
                linear-gradient(140deg, rgba(255, 255, 255, 0.18), transparent 45%),
                var(--pear);
            box-shadow: inset 0 -2px 0 rgba(69, 89, 31, 0.2);
            backface-visibility: hidden;
        }

        .wax-seal {
            position: absolute;
            top: 120px;
            left: 50%;
            z-index: 11;
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            color: var(--cream);
            background: var(--gold);
            border: 2px solid #dec996;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 2px rgba(91, 67, 29, 0.18),
                0 3px 9px rgba(53, 69, 22, 0.25);
            font-family: Georgia, serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            line-height: 1;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            transform: translateX(-50%);
        }

        .tap-note {
            position: absolute;
            bottom: -49px;
            left: 50%;
            width: max-content;
            margin: 0;
            color: var(--pear-dark);
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transform: translateX(-50%);
            animation: tapPulse 2s ease-in-out infinite;
            transition: opacity 0.25s ease;
        }

        /* =====================================================
           OPENING ANIMATION STATES
           ===================================================== */
        .js .suite-actions,
        .js .card-navigation {
            opacity: 0;
            pointer-events: none;
        }

        .js .suite-actions {
            transform: translateY(8px);
        }

        .js .card-navigation {
            transform: translateY(-50%);
        }

        .js .suite-card {
            opacity: 0;
            pointer-events: none;
        }

        /*
            Main invitation begins near the top opening of the envelope,
            not at the bottom of the page.
        */
        .js .card-primary {
            top: 43%;
            z-index: 5;
            transform: translate(-50%, -50%) rotate(0deg) scale(0.72);
        }

        .js .card-details {
            transform: translate(calc(-50% - 48px), calc(-50% + 72px)) rotate(-4deg) scale(0.72);
        }

        .js .card-photo {
            transform: translate(calc(-50% + 68px), calc(-50% + 76px)) rotate(4deg) scale(0.72);
        }

        .js .experience.is-opening .envelope-flap {
            transform: rotateX(-178deg);
        }

        .js .experience.is-opening .wax-seal,
        .js .experience.is-opening .tap-note {
            opacity: 0;
        }

        /*
            The main invitation rises UP from the envelope opening.
            The front folds remain above it while it is still inside.
        */
        .js .experience.is-opening .card-primary {
            top: -35%;
            z-index: 5;
            opacity: 1;
            transform: translate(-50%, -50%) rotate(0deg) scale(0.82);
            transition:
                opacity 0.12s ease 0.32s,
                top 1.08s cubic-bezier(0.18, 0.88, 0.22, 1) 0.42s,
                transform 1.08s cubic-bezier(0.18, 0.88, 0.22, 1) 0.42s;
        }

        .js .experience.is-open .extraction-pocket {
            clip-path: none;
        }

        .js .experience.is-open .envelope-stage {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.96);
        }

        .js .experience.is-open .suite-card {
            opacity: 1;
            pointer-events: auto;
        }

        .js .experience.is-open .card-primary {
            top: 50%;
            z-index: 4;
            transform: translate(-50%, -50%) rotate(-1deg);
            transition:
                top 0.58s cubic-bezier(0.2, 0.78, 0.25, 1) 0.08s,
                width 0.48s cubic-bezier(0.2, 0.78, 0.25, 1),
                transform 0.58s cubic-bezier(0.2, 0.78, 0.25, 1) 0.08s,
                opacity 0.3s ease;
        }

        .js .experience.is-open .card-details {
            transform: translate(calc(-50% - 48px), calc(-50% - 30px)) rotate(-4deg);
            transition-delay: 0.12s;
        }

        .js .experience.is-open .card-photo {
            transform: translate(calc(-50% + 68px), calc(-50% + 13px)) rotate(4deg);
            transition-delay: 0.2s;
        }

        .js .experience.is-open .card-primary.is-selected,
        .js .experience.is-open .card-details.is-selected,
        .js .experience.is-open .card-photo.is-selected {
            z-index: 15;
            width: var(--selected-width);
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
            transition-delay: 0s;
        }

        .js .experience.is-open .suite-actions {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            transition: opacity 0.4s ease 0.45s, transform 0.4s ease 0.45s;
        }

        .js .experience.is-open .card-navigation {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%);
            transition: opacity 0.4s ease 0.45s;
        }

        .js .experience.is-open + .replay-button {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes tapPulse {
            0%,
            100% {
                opacity: 0.62;
                transform: translateX(-50%) translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-4px);
            }
        }

        @media (min-width: 768px) {
            .page {
                padding-top: clamp(32px, 5svh, 80px);
                padding-bottom: clamp(32px, 5svh, 80px);
            }

            .experience {
                width: min(100%, 900px);
            }

            .suite-stage {
                min-height: max(680px, 82svh);
            }

            .card-primary {
                width: 340px;
            }

            .card-details {
                width: 275px;
                transform: translate(calc(-50% - 58px), calc(-50% - 38px)) rotate(-4deg);
            }

            .card-photo {
                width: 220px;
                transform: translate(calc(-50% + 82px), calc(-50% + 8px)) rotate(4deg);
            }

            .js .card-details {
                transform: translate(calc(-50% - 58px), calc(-50% + 72px)) rotate(-4deg) scale(0.72);
            }

            .js .card-photo {
                transform: translate(calc(-50% + 82px), calc(-50% + 76px)) rotate(4deg) scale(0.72);
            }

            .js .experience.is-open .card-details {
                transform: translate(calc(-50% - 58px), calc(-50% - 38px)) rotate(-4deg);
            }

            .js .experience.is-open .card-photo {
                transform: translate(calc(-50% + 82px), calc(-50% + 8px)) rotate(4deg);
            }

            .replay-button {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="experience" id="experience">

            <div class="suite-stage">
                <!-- Envelope -->
                <div class="envelope-stage">
                    <div class="envelope-back"></div>
                    <div class="envelope-liner"></div>

                    <div class="primary-card-peek">
                        <img src="invite1.png" alt="">
                    </div>

                    <div class="envelope-front"></div>
                    <div class="envelope-bottom-fold"></div>
                    <div class="envelope-flap"></div>
                    <div class="wax-seal">Z&amp;M</div>

                    <p class="tap-note">Tap to open</p>

                    <button
                        class="envelope-trigger"
                        id="openInvite"
                        type="button"
                        aria-label="Open Zumi and Morgan's wedding invitation suite"
                    ></button>
                </div>

                <!-- Main formal invitation -->
                <div class="extraction-pocket">
                    <button
                        type="button"
                        class="suite-card card-primary"
                        aria-label="View formal wedding invitation"
                        aria-pressed="false"
                    >
                        <img
                            src="invite1.png"
                            alt="Formal wedding invitation for Zumi Cuji and Morgan Fields"
                            decoding="async"
                            fetchpriority="high"
                        >
                    </button>
                </div>

                <!-- Details card -->
                <button
                    type="button"
                    class="suite-card card-details"
                    aria-label="View wedding details card"
                    aria-pressed="false"
                >
                    <img
                        src="invite2.png"
                        alt="Wedding details card"
                        decoding="async"
                        loading="eager"
                    >
                </button>

                <!-- Photo card -->
                <button
                    type="button"
                    class="suite-card card-photo"
                    aria-label="View wedding photo card"
                    aria-pressed="false"
                >
                    <img
                        src="invite3.png"
                        alt="Wedding photo card"
                        decoding="async"
                        loading="eager"
                    >
                </button>

                <!-- Side arrows -->
                <div class="card-navigation" aria-label="Invitation card navigation">
                    <button
                        class="nav-arrow"
                        id="previousCard"
                        type="button"
                        aria-label="Show previous card"
                    >
                        ‹
                    </button>

                    <button
                        class="nav-arrow"
                        id="nextCard"
                        type="button"
                        aria-label="Show next card"
                    >
                        ›
                    </button>
                </div>
            </div>

            <!-- Visible after envelope opens -->
            <div class="suite-actions">
                <a
                    class="website-button"
                    href="https://zumicuji.github.io/TheCujis/index.html"
                >
                    Visit Our Wedding Website
                </a>
            </div>
        </div>

        <button class="replay-button" id="replayButton" type="button">
            Replay
        </button>
    </main>

    <script>
        (function () {
            const experience = document.getElementById("experience");
            const openButton = document.getElementById("openInvite");
            const replayButton = document.getElementById("replayButton");
            const previousButton = document.getElementById("previousCard");
            const nextButton = document.getElementById("nextCard");

            const interactiveCards = [
                document.querySelector(".card-primary"),
                document.querySelector(".card-details"),
                document.querySelector(".card-photo")
            ];

            let activeCardIndex = 0;
            let touchHandled = false;

            document.documentElement.classList.add("js");

            /*
                Fit each selected PNG to the usable device viewport while
                preserving its exact original aspect ratio.
            */
            function updateCardFitSizes() {
                const viewportWidth = document.documentElement.clientWidth;
                const viewportHeight = window.innerHeight || document.documentElement.clientHeight;

                interactiveCards.forEach(function (card, index) {
                    const image = card.querySelector("img");
                    const naturalWidth = image.naturalWidth || image.width || 1;
                    const naturalHeight = image.naturalHeight || image.height || 1;
                    const aspectRatio = naturalWidth / naturalHeight;

                    const maxWidth = index === 2
                        ? viewportWidth * 0.64
                        : viewportWidth * 0.96;

                    const maxHeight = index === 2
                        ? viewportHeight * 0.58
                        : viewportHeight - 112;

                    const selectedWidth = Math.max(
                        120,
                        Math.min(maxWidth, maxHeight * aspectRatio)
                    );

                    card.style.setProperty(
                        "--selected-width",
                        `${Math.floor(selectedWidth)}px`
                    );
                });
            }

            function selectCard(index) {
                activeCardIndex =
                    (index + interactiveCards.length) % interactiveCards.length;

                updateCardFitSizes();

                interactiveCards.forEach(function (card, cardIndex) {
                    const selected = cardIndex === activeCardIndex;

                    card.classList.toggle("is-selected", selected);
                    card.setAttribute("aria-pressed", selected ? "true" : "false");
                });
            }

            function cycleCards(direction) {
                if (!experience.classList.contains("is-open")) {
                    return;
                }

                selectCard(activeCardIndex + direction);
            }

            function openInvitation() {
                if (
                    experience.classList.contains("is-opening") ||
                    experience.classList.contains("is-open")
                ) {
                    return;
                }

                experience.classList.add("is-opening");
                openButton.disabled = true;

                window.setTimeout(function () {
                    experience.classList.remove("is-opening");
                    experience.classList.add("is-open");
                    selectCard(0);
                }, 1550);
            }

            function replayInvitation() {
                experience.classList.remove("is-opening", "is-open");

                interactiveCards.forEach(function (card) {
                    card.classList.remove("is-selected");
                    card.setAttribute("aria-pressed", "false");
                });

                activeCardIndex = 0;
                openButton.disabled = false;

                void experience.offsetWidth;

                window.setTimeout(function () {
                    openInvitation();
                }, 80);
            }

            interactiveCards.forEach(function (card, index) {
                card.addEventListener("click", function () {
                    if (experience.classList.contains("is-open")) {
                        selectCard(index);
                    }
                });

                const image = card.querySelector("img");

                if (image.complete) {
                    updateCardFitSizes();
                } else {
                    image.addEventListener("load", updateCardFitSizes, { once: true });
                }
            });

            previousButton.addEventListener("click", function () {
                cycleCards(-1);
            });

            nextButton.addEventListener("click", function () {
                cycleCards(1);
            });

            /*
                Both click and touchend are included for reliable
                mobile Safari and Android browser interaction.
            */
            openButton.addEventListener("click", function () {
                if (!touchHandled) {
                    openInvitation();
                }

                touchHandled = false;
            });

            openButton.addEventListener("touchend", function (event) {
                event.preventDefault();
                touchHandled = true;
                openInvitation();
            }, { passive: false });

            replayButton.addEventListener("click", replayInvitation);

            window.addEventListener("resize", function () {
                updateCardFitSizes();

                if (experience.classList.contains("is-open")) {
                    selectCard(activeCardIndex);
                }
            });

            window.addEventListener("orientationchange", function () {
                window.setTimeout(function () {
                    updateCardFitSizes();

                    if (experience.classList.contains("is-open")) {
                        selectCard(activeCardIndex);
                    }
                }, 250);
            });

            updateCardFitSizes();
        })();
    </script>
</body>
</html>
