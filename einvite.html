<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>You Are Invited! — Zumi & Morgan</title>

    <meta property="og:title" content="You Are Invited! — Zumi & Morgan">
    <meta property="og:description" content="Monday, May 3, 2027 · Raleigh, NC">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zumicuji.github.io/TheCujis/invite.html">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="You Are Invited! — Zumi & Morgan">
    <meta name="twitter:description" content="Monday, May 3, 2027 · Raleigh, NC">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --pear-light: #dce7ad;
            --pear: #b9ca77;
            --pear-mid: #a6b965;
            --pear-deep: #71843f;
            --pear-dark: #53652d;
            --cream: #fffdf4;
            --gold: #b99754;
            --ink: #36502f;
            --page: #f1f4e7;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 10%, rgba(220, 231, 173, 0.76), transparent 30%),
                radial-gradient(circle at 88% 90%, rgba(185, 151, 84, 0.12), transparent 28%),
                var(--page);
            font-family: "Montserrat", sans-serif;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           PAGE / MOBILE SAFE SPACING
           ===================================================== */
        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(clamp(24px, 5svh, 64px), env(safe-area-inset-top))
                max(clamp(18px, 4vw, 64px), env(safe-area-inset-right))
                max(clamp(24px, 5svh, 64px), env(safe-area-inset-bottom))
                max(clamp(18px, 4vw, 64px), env(safe-area-inset-left));
        }

        .experience {
            width: min(100%, 960px);
            margin: 0 auto;
            text-align: center;
        }

        /* =====================================================
           FULL-PAGE PEAR-GREEN ENVELOPE
           ===================================================== */
        .full-envelope {
            display: none;
        }

        .js .full-envelope {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: block;
            pointer-events: none;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 38%),
                var(--pear-deep);
            transition: opacity 0.45s ease 1.1s;
        }

        .envelope-liner {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            background:
                radial-gradient(circle at 18% 25%, rgba(83, 101, 45, 0.11) 0 5px, transparent 6px),
                radial-gradient(circle at 72% 58%, rgba(83, 101, 45, 0.11) 0 6px, transparent 7px),
                var(--cream);
            transition: opacity 0.3s ease 0.25s;
        }

        /*
           Both front folds use the exact same color to prevent any
           darker triangle or polygon from appearing near the seal.
        */
        .fold-left,
        .fold-right {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 8;
            width: 58%;
            background: var(--pear-mid);
            transition:
                transform 0.85s cubic-bezier(0.18, 0.82, 0.24, 1) 0.2s,
                opacity 0.35s ease 1.15s;
        }

        .fold-left {
            left: 0;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .fold-right {
            right: 0;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        .fold-bottom {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 9;
            height: 54%;
            background: var(--pear-mid);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            transition:
                transform 0.85s cubic-bezier(0.18, 0.82, 0.24, 1) 0.25s,
                opacity 0.35s ease 1.15s;
        }

        .fold-top {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            z-index: 10;
            height: 56%;
            background:
                linear-gradient(140deg, rgba(255, 255, 255, 0.16), transparent 46%),
                var(--pear);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform: rotateX(0deg);
            transform-origin: top center;
            transform-style: preserve-3d;
            transition:
                transform 0.78s cubic-bezier(0.22, 0.8, 0.25, 1),
                opacity 0.35s ease 1.15s;
        }

        .wax-seal {
            position: absolute;
            top: 54%;
            left: 50%;
            z-index: 12;
            display: grid;
            width: clamp(72px, 12vw, 112px);
            height: clamp(72px, 12vw, 112px);
            place-items: center;
            color: var(--cream);
            background: var(--gold);
            border: clamp(2px, 0.45vw, 4px) solid #dec996;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 clamp(2px, 0.45vw, 4px) rgba(91, 67, 29, 0.18),
                0 6px 18px rgba(53, 69, 22, 0.28);
            font-family: Georgia, serif;
            font-size: clamp(1.1rem, 3.2vw, 2rem);
            font-weight: 600;
            letter-spacing: -1px;
            line-height: 1;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .tap-note {
            position: absolute;
            bottom: max(clamp(34px, 8svh, 76px), env(safe-area-inset-bottom));
            left: 50%;
            z-index: 13;
            width: max-content;
            margin: 0;
            color: var(--cream);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(54, 72, 25, 0.2);
            text-transform: uppercase;
            transform: translateX(-50%);
            animation: tapPulse 2s ease-in-out infinite;
        }

        .envelope-trigger {
            position: absolute;
            inset: 0;
            z-index: 20;
            padding: 0;
            background: transparent;
            border: 0;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .envelope-trigger:focus-visible {
            outline: 4px solid var(--gold);
            outline-offset: -10px;
        }

        /* =====================================================
           INVITATION CARD AREA
           ===================================================== */
        .suite-stage {
            position: relative;
            min-height: max(600px, 78svh);
            width: 100%;
        }

        /*
           All cards remain perfectly centered and straight.
           They are different sizes in the resting stack but have
           no rotation or directional offset.
        */
        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            padding: 0;
            margin: 0;
            background: transparent;
            border: 0;
            cursor: pointer;
            visibility: visible;
            transform: translate(-50%, -50%);
            transition:
                width 0.45s cubic-bezier(0.2, 0.78, 0.25, 1),
                transform 0.45s cubic-bezier(0.2, 0.78, 0.25, 1),
                top 0.65s cubic-bezier(0.18, 0.85, 0.25, 1),
                visibility 0s linear 0.45s;
        }

        .card:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 6px;
        }

        .card img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            background: var(--cream);
            box-shadow: 0 14px 28px rgba(54, 72, 25, 0.2);
            image-rendering: auto;
        }

        .primary-card {
            z-index: 4;
            width: min(68vw, 330px);
        }

        .details-card {
            z-index: 2;
            width: min(54vw, 260px);
        }

        .photo-card {
            z-index: 1;
            width: min(43vw, 195px);
        }

        .card.is-active {
            z-index: 20;
            width: var(--selected-width);
            transform: translate(-50%, -50%);
        }

        .card.is-active img {
            max-height: calc(100svh - 112px);
            object-fit: contain;
            box-shadow: 0 28px 48px rgba(54, 72, 25, 0.3);
        }

        /* =====================================================
           CARD NAVIGATION
           ===================================================== */
        .card-navigation {
            position: absolute;
            top: 50%;
            right: 0;
            left: 0;
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
            transform: translateY(-50%);
        }

        .opened .card-navigation {
            display: flex;
        }

        .nav-arrow {
            display: grid;
            width: 46px;
            height: 62px;
            place-items: center;
            color: var(--ink);
            background: rgba(255, 253, 244, 0.32);
            border: 1px solid rgba(83, 101, 45, 0.25);
            border-radius: 25px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 1.9rem;
            line-height: 1;
            opacity: 0.62;
            touch-action: manipulation;
            transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .nav-arrow:hover,
        .nav-arrow:focus-visible {
            color: var(--cream);
            background: var(--ink);
            opacity: 0.98;
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .nav-arrow:active {
            transform: scale(0.94);
        }

        /* =====================================================
           POST-OPEN CONTROLS
           ===================================================== */
        .suite-actions {
            display: none;
            margin-top: -12px;
        }

        .opened .suite-actions {
            display: block;
        }

        .website-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 13px 19px;
            color: var(--ink);
            background: rgba(185, 202, 119, 0.72);
            border: 1px solid rgba(83, 101, 45, 0.58);
            box-shadow: 0 4px 12px rgba(83, 101, 45, 0.1);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            line-height: 1.3;
            text-decoration: none;
            text-transform: uppercase;
        }

        .website-button:hover,
        .website-button:focus-visible {
            color: var(--cream);
            background: rgba(83, 101, 45, 0.88);
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        .replay-button {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            z-index: 100;
            display: none;
            padding: 9px 11px;
            color: var(--ink);
            background: rgba(255, 253, 244, 0.96);
            border: 1px solid var(--gold);
            cursor: pointer;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .opened + .replay-button {
            display: block;
        }

        .replay-button:hover,
        .replay-button:focus-visible {
            background: #ffffff;
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        /* =====================================================
           INITIAL / OPENING STATES
           ===================================================== */
        .js .card {
            visibility: hidden;
            pointer-events: none;
        }

        .js .primary-card {
            top: 58%;
            z-index: 5;
            visibility: visible;
            transform: translate(-50%, -50%) scale(0.7);
        }

        .opening .fold-top {
            transform: rotateX(-178deg);
        }

        .opening .fold-left {
            transform: translateX(-110%);
        }

        .opening .fold-right {
            transform: translateX(110%);
        }

        .opening .fold-bottom {
            transform: translateY(110%);
        }

        .opening .envelope-liner {
            opacity: 1;
        }

        .opening .wax-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .opening .tap-note {
            opacity: 0;
        }

        /*
           Main invitation rises from the middle envelope opening,
           never from the bottom of the phone screen.
        */
        .opening .primary-card {
            top: 29%;
            z-index: 25;
            transform: translate(-50%, -50%) scale(0.84);
            transition:
                top 1.05s cubic-bezier(0.18, 0.88, 0.22, 1) 0.42s,
                transform 1.05s cubic-bezier(0.18, 0.88, 0.22, 1) 0.42s;
        }

        .opening .envelope-back {
            opacity: 0;
        }

        /*
           Mobile fix: remove the invisible envelope trigger after
           opening so it cannot intercept taps on arrows or cards.
        */
        .opened .full-envelope {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 0.35s ease,
                visibility 0s linear 0.35s;
        }

        .opened .full-envelope .envelope-trigger {
            display: none;
            pointer-events: none;
        }

        .opened .card {
            visibility: visible;
            pointer-events: auto;
        }

        .opened .primary-card,
        .opened .details-card,
        .opened .photo-card {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .opened .primary-card {
            z-index: 4;
        }

        @keyframes tapPulse {
            0%,
            100% {
                opacity: 0.62;
                transform: translateX(-50%) translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-4px);
            }
        }

        @media (max-width: 480px) {
            .suite-stage {
                min-height: max(560px, 76svh);
            }

            .nav-arrow {
                width: 42px;
                height: 58px;
            }
        }

        @media (min-width: 768px) {
            .suite-stage {
                min-height: max(680px, 82svh);
            }

            .primary-card {
                width: 350px;
            }

            .details-card {
                width: 282px;
            }

            .photo-card {
                width: 225px;
            }

            .replay-button {
                top: 20px;
                right: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }

            .js .full-envelope {
                display: none;
            }

            .js .card {
                visibility: visible;
                pointer-events: auto;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="experience" id="experience">

            <!-- Full-page pear-green envelope -->
            <div class="full-envelope">
                <div class="envelope-back"></div>
                <div class="envelope-liner"></div>
                <div class="fold-left"></div>
                <div class="fold-right"></div>
                <div class="fold-bottom"></div>
                <div class="fold-top"></div>

                <div class="wax-seal">Z &amp; M</div>

                <p class="tap-note">Tap to open</p>

                <button
                    class="envelope-trigger"
                    id="openInvite"
                    type="button"
                    aria-label="Open Zumi and Morgan's wedding invitation suite"
                ></button>
            </div>

            <!-- Actual invitation PNG cards -->
            <div class="suite-stage">
                <button
                    type="button"
                    class="card primary-card"
                    aria-label="View formal wedding invitation"
                    aria-pressed="false"
                >
                    <img
                        src="invite1.png"
                        alt="Formal wedding invitation for Zumi Cuji and Morgan Fields"
                        decoding="async"
                        fetchpriority="high"
                    >
                </button>

                <button
                    type="button"
                    class="card details-card"
                    aria-label="View wedding details card"
                    aria-pressed="false"
                >
                    <img
                        src="invite2.png"
                        alt="Wedding details card"
                        decoding="async"
                        loading="eager"
                    >
                </button>

                <button
                    type="button"
                    class="card photo-card"
                    aria-label="View wedding photo card"
                    aria-pressed="false"
                >
                    <img
                        src="invite3.png"
                        alt="Wedding photo card"
                        decoding="async"
                        loading="eager"
                    >
                </button>

                <div class="card-navigation" aria-label="Invitation card navigation">
                    <button
                        class="nav-arrow"
                        id="previousCard"
                        type="button"
                        aria-label="Show previous card"
                    >
                        ‹
                    </button>

                    <button
                        class="nav-arrow"
                        id="nextCard"
                        type="button"
                        aria-label="Show next card"
                    >
                        ›
                    </button>
                </div>
            </div>

            <div class="suite-actions">
                <a
                    class="website-button"
                    href="https://zumicuji.github.io/TheCujis/index.html"
                >
                    Visit Our Wedding Website
                </a>
            </div>
        </div>

        <button class="replay-button" id="replayButton" type="button">
            Replay
        </button>
    </main>

    <script>
        (function () {
            const experience = document.getElementById("experience");
            const openButton = document.getElementById("openInvite");
            const replayButton = document.getElementById("replayButton");
            const previousButton = document.getElementById("previousCard");
            const nextButton = document.getElementById("nextCard");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

            const cards = [
                document.querySelector(".primary-card"),
                document.querySelector(".details-card"),
                document.querySelector(".photo-card")
            ];

            let activeCardIndex = 0;
            let lastTouchTime = 0;
            let lastArrowTouchTime = 0;

            document.documentElement.classList.add("js");

            /*
               Calculates a selected card width based on its actual
               PNG ratio while preserving equal safe margins.
            */
            function updateCardFitSizes() {
                const viewportWidth = document.documentElement.clientWidth;
                const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
                const safeMargin = Math.max(24, Math.min(viewportWidth * 0.05, 64));

                cards.forEach(function (card, index) {
                    const image = card.querySelector("img");
                    const naturalWidth = image.naturalWidth || image.width || 1;
                    const naturalHeight = image.naturalHeight || image.height || 1;
                    const aspectRatio = naturalWidth / naturalHeight;

                    const widthLimit = index === 2
                        ? viewportWidth - (safeMargin * 4)
                        : viewportWidth - (safeMargin * 2);

                    const heightLimit = index === 2
                        ? viewportHeight - (safeMargin * 4)
                        : viewportHeight - (safeMargin * 2);

                    const selectedWidth = Math.max(
                        120,
                        Math.min(widthLimit, heightLimit * aspectRatio)
                    );

                    card.style.setProperty(
                        "--selected-width",
                        `${Math.floor(selectedWidth)}px`
                    );
                });
            }

            function selectCard(index) {
                activeCardIndex = (index + cards.length) % cards.length;

                updateCardFitSizes();

                cards.forEach(function (card, cardIndex) {
                    const isActive = cardIndex === activeCardIndex;

                    card.classList.toggle("is-active", isActive);
                    card.setAttribute("aria-pressed", isActive ? "true" : "false");
                });
            }

            function cycleCards(direction) {
                if (!experience.classList.contains("opened")) {
                    return;
                }

                selectCard(activeCardIndex + direction);
            }

            function openInvitation() {
                if (
                    experience.classList.contains("opening") ||
                    experience.classList.contains("opened")
                ) {
                    return;
                }

                experience.classList.add("opening");
                openButton.disabled = true;

                window.setTimeout(function () {
                    experience.classList.remove("opening");
                    experience.classList.add("opened");
                    selectCard(0);
                }, 1900);
            }

            function replayInvitation() {
                experience.classList.remove("opening", "opened");

                cards.forEach(function (card) {
                    card.classList.remove("is-active");
                    card.setAttribute("aria-pressed", "false");
                });

                activeCardIndex = 0;
                openButton.disabled = false;

                void experience.offsetWidth;

                window.setTimeout(openInvitation, 80);
            }

            function handleArrow(direction, event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                cycleCards(direction);
            }

            cards.forEach(function (card, index) {
                card.addEventListener("click", function () {
                    if (experience.classList.contains("opened")) {
                        selectCard(index);
                    }
                });

                card.addEventListener("touchend", function (event) {
                    if (experience.classList.contains("opened")) {
                        event.preventDefault();
                        selectCard(index);
                    }
                }, { passive: false });

                const image = card.querySelector("img");

                if (image.complete) {
                    updateCardFitSizes();
                } else {
                    image.addEventListener("load", updateCardFitSizes, { once: true });
                }
            });

            previousButton.addEventListener("touchend", function (event) {
                lastArrowTouchTime = Date.now();
                handleArrow(-1, event);
            }, { passive: false });

            nextButton.addEventListener("touchend", function (event) {
                lastArrowTouchTime = Date.now();
                handleArrow(1, event);
            }, { passive: false });

            previousButton.addEventListener("click", function (event) {
                if (Date.now() - lastArrowTouchTime > 700) {
                    handleArrow(-1, event);
                }
            });

            nextButton.addEventListener("click", function (event) {
                if (Date.now() - lastArrowTouchTime > 700) {
                    handleArrow(1, event);
                }
            });

            openButton.addEventListener("touchend", function (event) {
                event.preventDefault();
                lastTouchTime = Date.now();
                openInvitation();
            }, { passive: false });

            openButton.addEventListener("click", function () {
                if (Date.now() - lastTouchTime > 700) {
                    openInvitation();
                }
            });

            replayButton.addEventListener("click", replayInvitation);

            window.addEventListener("resize", function () {
                updateCardFitSizes();

                if (experience.classList.contains("opened")) {
                    selectCard(activeCardIndex);
                }
            });

            window.addEventListener("orientationchange", function () {
                window.setTimeout(function () {
                    updateCardFitSizes();

                    if (experience.classList.contains("opened")) {
                        selectCard(activeCardIndex);
                    }
                }, 250);
            });

            updateCardFitSizes();

            if (reducedMotion.matches) {
                experience.classList.add("opened");
                openButton.disabled = true;
                selectCard(0);
            }
        })();
    </script>
</body>
</html>
