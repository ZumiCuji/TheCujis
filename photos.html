  <style>
    /* GLOBAL STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --script-font: "Alex Brush", cursive;
      --body-font: "Cinzel", serif;
      --paper: #fffdf9;
      --warm-white: #faf7f1;
      --ink: #24221f;
      --muted-ink: #6d675e;
      --line: #e5ded3;
      --soft-line: #f0ece5;
      --gallery-gap: 1.1rem;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body-font);
      font-size: 1rem;
      line-height: 1.8;
      text-align: center;
      overflow-x: hidden;
    }

    h1, h2 {
      margin: 0;
      color: var(--ink);
      font-family: var(--script-font);
      font-weight: 400;
      line-height: 1.05;
    }

    h1 {
      font-size: clamp(3.3rem, 10vw, 5.4rem);
    }

    h2 {
      font-size: clamp(2.8rem, 8vw, 4.3rem);
    }

    p {
      margin: 0 0 1.2rem;
    }

    /* HEADER & NAVIGATION */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0.9rem 1rem 0.75rem;
      background: rgba(255, 253, 249, 0.96);
      border-bottom: 1px solid var(--soft-line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    header h1 {
      margin-bottom: 0.3rem;
      font-size: clamp(2.8rem, 7vw, 4.15rem);
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
    }

    nav a {
      padding: 0.2rem 0.25rem;
      color: var(--ink);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #977957;
    }

    /* PAGE LAYOUT */
    .site-shell {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 0 1.1rem;
    }

    section {
      padding: 4.8rem 0;
      border-bottom: 1px solid var(--soft-line);
    }

    .gallery-page-heading {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }

    .gallery-page-heading p {
      max-width: 580px;
      margin: 1rem auto 0;
      color: var(--muted-ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
    }

    /* PHOTO COLLAGE */
    #photo-journey {
      padding-top: 1.5rem;
    }

    .photo-journey-grid {
      display: block;
      width: 100%;
      max-width: 1000px;
      margin-inline: auto;
      column-count: 2;
      column-gap: var(--gallery-gap);
      column-fill: balance;
      text-align: left;
    }

    .gallery-photo-slot {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0 0 var(--gallery-gap);
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .photo-figure {
      margin: 0;
    }

    .photo-frame {
      padding: 0.45rem;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(66, 54, 36, 0.07);
    }

    .photo-frame img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
    }

    /* TABLETS */
    @media (min-width: 680px) {
      .photo-journey-grid {
        column-count: 3;
      }
    }

    /* DESKTOP */
    @media (min-width: 1050px) {
      .photo-journey-grid {
        column-count: 4;
      }
    }

    /* MOBILE */
    @media (max-width: 479px) {
      .site-shell {
        padding-inline: 0.85rem;
      }

      .photo-journey-grid {
        column-count: 2;
        column-gap: 0.7rem;
      }

      .gallery-photo-slot {
        margin-bottom: 0.7rem;
      }

      .photo-frame {
        padding: 0.25rem;
        box-shadow: none;
      }

      nav {
        gap: 0.25rem 0.7rem;
      }

      nav a {
        font-size: 0.61rem;
        letter-spacing: 1.2px;
      }
    }

    /* FOOTER */
    footer {

      color: var(--muted-ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      font-style: italic;
    }
  </style>
</head>

  <!-- PHOTO 4 FILENAME FALLBACK -->
  <script>
    (function () {
      const image = document.querySelector('[data-photo-four]');
      if (!image) return;

      const candidates = [
        'images/4.JPEG',
        'images/4.jpeg',
        'images/4.jpg',
        'images/4.JPG',
        'images/4.png',
        'images/4.PNG',
        'images/4.webp',
        'images/4.WEBP'
      ];

      let next = 1;

      image.addEventListener('error', function () {
        if (next < candidates.length) {
          image.src = candidates[next++];
        } else {
          console.warn(
            'Wedding photo 4 could not be found. ' +
            'Check the filename and images folder.'
          );
        }
      });
    })();
  </script>
